[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "max-mcp"
version = "0.2.0"
description = "MCP server that talks to a live Autodesk 3ds Max session (pymxs listener + official mcp SDK; stdio and streamable HTTP)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["3ds Max", "MCP", "model context protocol", "pymxs", "MAXScript"]
dependencies = [
    "mcp>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
max-mcp = "max_mcp.server:main"

[tool.setuptools.packages.find]
include = ["max_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
